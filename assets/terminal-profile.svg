<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="terminal-title terminal-description">
  <title id="terminal-title">QmFkLVBp — terminal profile</title>
  <desc id="terminal-description">Bad-Pi, cybersecurity engineer. OSINT, Red Team and security tooling. Repositories: hckfetch, 0 stars; SSPE, 0 stars; decryptoinator, 1 star; MIMEXOR, 0 stars. Stars checked on 2026-10-28. Repository views are not connected.</desc>
